apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keenetic-operator
  namespace: argo-cd
spec:
  project: networking
  source:
    repoURL: git@github.com:Arbuzov/home-k8s-helm.git
    targetRevision: HEAD
    path: arbuzov/networking/keenetic-operator
    helm:
      values: |
        # Held at zero again. Bringing the controller up with keenDNSZone set
        # did not repair the publications — it deleted nine of the eleven
        # `ip http proxy` entries outright (dev, k8s, n8n, photos, tasks,
        # books, litellm, otel, notes), leaving only `home` and a `homepage`
        # still stuck on `domain static`. The `ip host` records survived, so
        # every name kept resolving to the router with nothing behind it.
        # The entries below were restored by hand; do not raise this to 1
        # until the deletion path is understood and covered by a test.
        replicaCount: 0
        keenetic:
          host: "192.168.99.1:22"
          existingSecret: keenetic-operator-creds
          defaultIngressIP: "192.168.99.1"
        publish:
          # Where the router proxies to. Deliberately NOT defaultIngressIP: names
          # must resolve to the router so the request goes through its KeenDNS
          # proxy, and the proxy then forwards here, to ingress-nginx.
          upstreamIP: "192.168.99.44"
          # HTTPS, not HTTP. Several Ingresses on dev.* carry ssl-redirect, so a
          # plain :80 upstream answers 308 -> https://dev..., which resolves back
          # to the router, which proxies to :80 again: a redirect loop that takes
          # out Argo CD, Grafana, Prometheus and every MCP server at once. The
          # hand-made entry this replaced was HTTPS/443 for exactly that reason.
          upstreamScheme: https
          upstreamPort: 443
          # Names in this zone get `domain ndns` (proper KeenDNS web-app
          # publication); anything outside it falls back to `domain static`.
          keenDNSZone: "whitediver.keenetic.link"
        nodeSelector:
          kubernetes.io/hostname: kube-master
  destination:
    server: https://kubernetes.default.svc
    namespace: keenetic-operator
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
