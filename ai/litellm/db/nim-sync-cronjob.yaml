apiVersion: batch/v1
kind: CronJob
metadata:
  name: litellm-nim-sync
  namespace: litellm
spec:
  schedule: "0 */3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: sync
              image: python:3.12-alpine
              imagePullPolicy: IfNotPresent
              env:
                - name: LITELLM_MASTER_KEY
                  valueFrom:
                    secretKeyRef:
                      name: litellm-masterkey
                      key: masterkey
                - name: NVIDIA_NIM_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: litellm-env-secret
                      key: NVIDIA_NIM_API_KEY
                - name: NVIDIA_NIM_API_BASE
                  valueFrom:
                    secretKeyRef:
                      name: litellm-env-secret
                      key: NVIDIA_NIM_API_BASE
                - name: NIM_RPM
                  value: "35"
                - name: HTTPS_PROXY
                  value: "http://wg-vless-gateway-proxy.vpn.svc.cluster.local:1080"
              command: ["python3", "-c"]
              args:
                - |
                  import json, os, re, time, urllib.request as u
                  from urllib.error import HTTPError

                  LL = "http://litellm:4000"
                  KEY = os.environ["LITELLM_MASTER_KEY"]
                  NIM_KEY = os.environ["NVIDIA_NIM_API_KEY"]
                  NIM_BASE = os.environ["NVIDIA_NIM_API_BASE"].rstrip("/")
                  NIM_RPM = int(os.environ.get("NIM_RPM", "35"))
                  PROBE_GAP = float(os.environ.get("PROBE_GAP_S", "4"))
                  PROBE_TIMEOUT = float(os.environ.get("PROBE_TIMEOUT_S", "30"))
                  FEATURED_URL = "https://assets.ngc.nvidia.com/products/api-catalog/featured-models.json"

                  # GitHub Copilot: explicit models registered by name (no wildcard). Auth is via
                  # the access-token mounted into the litellm pod, so no credentials are needed here.
                  # Curated to ids that actually return content on the current subscription — the full
                  # Copilot catalog also exposes gated (opus, gpt-5.5) and empty-response (gemini, kimi) ids.
                  COPILOT = [
                      "claude-sonnet-5",
                      "claude-sonnet-4.6",
                      "claude-haiku-4.5",
                      "gpt-5.4",
                  ]

                  def get(url, tok=None):
                      headers = {"Authorization": "Bearer " + tok} if tok else {}
                      return json.load(u.urlopen(u.Request(url, headers=headers), timeout=30))

                  def send(path, body, method="POST"):
                      req = u.Request(LL + path, data=json.dumps(body).encode(), method=method,
                                      headers={"Authorization": "Bearer " + KEY,
                                               "Content-Type": "application/json"})
                      u.urlopen(req, timeout=30)

                  def add(model_name, params, model_info=None):
                      body = {"model_name": model_name, "litellm_params": params}
                      if model_info:
                          body["model_info"] = model_info
                      send("/model/new", body)

                  def update(model_id, params, model_info):
                      # PATCH merges into the stored row: api_key/api_base stay as they are.
                      body = {}
                      if params:
                          body["litellm_params"] = params
                      if model_info:
                          body["model_info"] = model_info
                      send("/model/%s/update" % model_id, body, "PATCH")

                  def delete(model_id):
                      send("/model/delete", {"id": model_id})

                  # NVIDIA publishes no pricing or rate-limit API: /models carries only
                  # id/object/created/owned_by and responses carry no x-ratelimit-* headers.
                  # Context / max-output exist only for the handful of "featured" models, in an
                  # undocumented catalog asset that spells ids differently (z-ai/glm-5-3 vs the
                  # catalog's z-ai/glm-5.3) - hence norm(). Best-effort: if it is unreachable the
                  # token limits are left as they are; price and rpm do not depend on it.
                  def norm(mid):
                      return re.sub(r"[._]", "-", mid.lower())

                  try:
                      featured = {norm(f["model"]): f for f in get(FEATURED_URL)["featured-models"]}
                  except Exception as e:
                      print("featured-models unavailable, token limits left as is:", e)
                      featured = {}

                  def nim_limits(mid):
                      # Price lives on litellm_params: a PATCH silently drops *_cost_per_token
                      # from model_info as "display pricing derived from the cost map".
                      params = {"rpm": NIM_RPM, "input_cost_per_token": 0.0, "output_cost_per_token": 0.0}
                      info = {}
                      f = featured.get(norm(mid))
                      if f and f.get("context"):
                          info["max_input_tokens"] = int(f["context"])
                      if f and f.get("max-output"):
                          info["max_output_tokens"] = int(f["max-output"])
                      return params, info

                  def is_managed_nim(m):
                      # Only DB rows this job owns. The nvidia_nim/* wildcard in the config expands
                      # into config-backed entries (db_model false) that /model/delete and
                      # /model/{id}/update reject with 400 - never touch those.
                      pm = (m.get("litellm_params") or {}).get("model") or ""
                      return ((m.get("model_info") or {}).get("db_model") is True
                              and pm.startswith("nvidia_nim/") and pm != "nvidia_nim/*")

                  # NVIDIA NIM: whole catalog, dynamically. A catalog fetch can fail for
                  # reasons that have nothing to do with the models (451 when egress leaves
                  # through a blocked IP, proxy down, NVIDIA outage) - that is not a reason
                  # to fail the run, and definitely not a reason to prune.
                  try:
                      catalog = [m["id"] for m in get(NIM_BASE + "/models", NIM_KEY)["data"]]
                  except Exception as e:
                      print("NIM catalog unavailable, skipping NIM add + prune:", e)
                      catalog = None

                  # Liveness. Being listed in /models says nothing about whether a model still
                  # answers: NVIDIA keeps listing ids whose function is gone, and those 404 with
                  # "Function '<uuid>': Not found for account". That body (or a 410) is the only
                  # thing read as dead - it comes from NVCF after the id was resolved, so it holds
                  # on any endpoint. A bare "404 page not found" is a route miss (an embedding
                  # model asked for chat), so the next endpoint is tried. A 2xx is ok, and so is a
                  # 400/422: the model itself rejected the input (nemotron-parse takes no text),
                  # so the function is there. Anything else - timeout, 429, 5xx, 401/403 - is
                  # "unknown": an existing row is kept, a new id is not added yet. PROBE_GAP
                  # sleeps before every request, so the sweep never exceeds 60/PROBE_GAP rpm
                  # however fast NVIDIA answers.
                  PROBES = [("/chat/completions",
                             {"messages": [{"role": "user", "content": "hi"}], "max_tokens": 1}),
                            ("/embeddings", {"input": ["hi"], "input_type": "query"}),
                            ("/completions", {"prompt": "hi", "max_tokens": 1})]

                  def nim_post(path, body):
                      req = u.Request(NIM_BASE + path, data=json.dumps(body).encode(),
                                      headers={"Authorization": "Bearer " + NIM_KEY,
                                               "Content-Type": "application/json"})
                      try:
                          with u.urlopen(req, timeout=PROBE_TIMEOUT) as r:
                              return r.status, ""
                      except HTTPError as e:
                          # The body read is a second network read: a stall here raises inside
                          # this handler, where the clause below cannot catch it.
                          try:
                              text = e.read(500).decode("utf-8", "replace")
                          except Exception as x:
                              text = "body unreadable: %s" % x
                          return e.code, text
                      except Exception as e:
                          return None, str(e)

                  def probe(mid):
                      why = "no endpoint routes it"
                      for path, body in PROBES:
                          time.sleep(PROBE_GAP)
                          code, text = nim_post(path, dict(body, model=mid))
                          if code == 410 or (code == 404 and "Not found for account" in text):
                              return "dead"
                          if code == 404:
                              continue
                          if code is not None and (code < 300 or code in (400, 422)):
                              return "ok"
                          why = "%s %s %s" % (path, code, " ".join(text.split())[:120])
                          break
                      print("probe unknown", mid, "-", why)
                      return "unknown"

                  health = {mid: probe(mid) for mid in (catalog or [])}
                  alive = sum(1 for s in health.values() if s == "ok")
                  dead_ids = {mid for mid, s in health.items() if s == "dead"}

                  # Read the DB only now: the sweep takes minutes, and the prune below deletes
                  # by the ids in this snapshot.
                  info = get(LL + "/model/info", KEY)["data"]
                  existing = {m["model_name"] for m in info}
                  added = 0

                  # Only an id that answered is registered. A timeout, 429 or proxy blip must
                  # not bring back a model pruned as dead; a new model that was merely busy is
                  # added on the next run it answers, and the wildcard routes it meanwhile.
                  for mid in (catalog or []):
                      if mid in existing or health[mid] != "ok":
                          continue
                      params, minfo = nim_limits(mid)
                      try:
                          add(mid, dict({"model": "nvidia_nim/" + mid, "api_key": NIM_KEY,
                                         "api_base": NIM_BASE}, **params), minfo)
                          added += 1
                          print("added nim", mid)
                      except Exception as e:
                          print("FAIL nim", mid, e)

                  # GitHub Copilot: explicit list, model_name prefixed for provenance
                  for mid in COPILOT:
                      name = "github_copilot/" + mid
                      if name in existing:
                          continue
                      try:
                          add(name, {"model": "github_copilot/" + mid})
                          added += 1
                          print("added copilot", mid)
                      except Exception as e:
                          print("FAIL copilot", mid, e)

                  # Prune: delete NIM models that are gone - either the catalog no longer lists
                  # them, or it still does but the probe above got an affirmative "dead". Scope:
                  # only DB models we manage (is_managed_nim) - never the wildcard, its
                  # config-backed expansions or github_copilot/*. When the fetch failed outright
                  # (catalog is None) the loop below sees no candidates, so a failed catalog can
                  # never be read as "everything is EOL, delete it all".
                  # Each kind has its own guard. Missing from the catalog: if more than PRUNE_CAP
                  # are, the catalog probably came back short, so skip rather than mass-delete
                  # good models (scaled with the catalog, floor 15). Dead by probe: every one of
                  # them is a per-model 404 from NVIDIA, so no count is suspicious on its own -
                  # 54 of 85 were dead at once - but when not a single model answered, the
                  # account or NVIDIA is the problem, not the models.
                  catalog_full = catalog or []
                  PRUNE_CAP = max(15, len(catalog_full) // 4)
                  catalog_set = set(catalog_full)
                  gone, dead = [], []
                  for m in (info if catalog is not None else []):
                      if not is_managed_nim(m):
                          continue
                      nid = m["litellm_params"]["model"][len("nvidia_nim/"):]
                      if nid not in catalog_set:
                          gone.append(m)
                      elif nid in dead_ids:
                          dead.append(m)
                  stale = []
                  if len(gone) > PRUNE_CAP:
                      print("SKIP prune: %d models left the catalog (> cap %d) - catalog likely short"
                            " this run" % (len(gone), PRUNE_CAP))
                  else:
                      stale += gone
                  if dead and not alive:
                      print("SKIP prune: %d models probe dead but none answered - account or NVIDIA"
                            " problem, not the models" % len(dead))
                  else:
                      stale += dead
                  removed = 0
                  for m in stale:
                      mid = (m.get("model_info") or {}).get("id")
                      if not mid:
                          print("SKIP prune (no id)", m["model_name"]); continue
                      try:
                          delete(mid)
                          removed += 1
                          print("pruned", m["model_name"])
                      except Exception as e:
                          print("FAIL prune", m["model_name"], e)

                  # GitHub Copilot is paid for by subscription, not per token, but LiteLLM's cost map
                  # (1.106.2) prices github_copilot/* at the upstream vendor's API rates - cache and
                  # >272k tiers included - so every call would log made-up spend. Zero every
                  # per-token price the cost map shows for the row: read from model_info (where
                  # /model/info displays cost-map pricing), compared against litellm_params (where
                  # the override lives), so a zeroed row produces no diff on the next run.
                  def is_managed_copilot(m):
                      pm = (m.get("litellm_params") or {}).get("model") or ""
                      return ((m.get("model_info") or {}).get("db_model") is True
                              and pm.startswith("github_copilot/"))

                  def copilot_zero(m):
                      return {k: 0.0 for k, v in (m.get("model_info") or {}).items()
                              if "cost" in k and isinstance(v, (int, float))
                              and not isinstance(v, bool) and v}

                  # Price / rpm / token limits on models registered before (or by an older version
                  # of) this job. Diff-only: a row already carrying the target values is not
                  # written, so a steady-state run issues no PATCH at all. Runs even when the
                  # catalog fetch failed - none of these values come from the catalog. /model/info
                  # is read again so rows added or pruned above are seen as they are now: a new
                  # model gets its values in this run, not three hours later.
                  info = get(LL + "/model/info", KEY)["data"]
                  updated = 0
                  for m in info:
                      if is_managed_nim(m):
                          kind = "nim"
                          params, minfo = nim_limits(m["litellm_params"]["model"][len("nvidia_nim/"):])
                      elif is_managed_copilot(m):
                          kind = "copilot"
                          params, minfo = copilot_zero(m), {}
                      else:
                          continue
                      mi_cur = m.get("model_info") or {}
                      lp_cur = m["litellm_params"]
                      lp_diff = {k: v for k, v in params.items() if lp_cur.get(k) != v}
                      mi_diff = {k: v for k, v in minfo.items() if mi_cur.get(k) != v}
                      if not lp_diff and not mi_diff:
                          continue
                      try:
                          update(mi_cur["id"], lp_diff, mi_diff)
                          updated += 1
                          print("updated", kind, m["model_name"], sorted(list(lp_diff) + list(mi_diff)))
                      except Exception as e:
                          print("FAIL update", m["model_name"], e)

                  print("done: %d added, %d updated, %d pruned, %d existing, %d nim catalog "
                        "(%d ok, %d dead, %d unknown), %d featured, %d copilot"
                        % (added, updated, removed, len(existing),
                           -1 if catalog is None else len(catalog), alive, len(dead_ids),
                           len(health) - alive - len(dead_ids), len(featured), len(COPILOT)))
