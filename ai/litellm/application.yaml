apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: litellm
  namespace: argo-cd
spec:
  project: ai
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  sources:
    - repoURL: ghcr.io/berriai
      targetRevision: 1.96.2
      chart: litellm-helm
      helm:
        values: |
          replicaCount: 0
          image:
            repository: ghcr.io/berriai/litellm-database
            pullPolicy: IfNotPresent
          masterkeySecretName: litellm-masterkey
          masterkeySecretKey: masterkey
          db:
            deployStandalone: false
            useExisting: true
            endpoint: litellm-pg-rw
            database: litellm
            secret:
              name: litellm-db
              usernameKey: username
              passwordKey: password
          migrationJob:
            enabled: false
            resources:
              requests:
                memory: "256Mi"
                cpu: "250m"
              limits:
                memory: "2560Mi"
                cpu: "1000m"
            hooks:
              argocd:
                enabled: true
              helm:
                enabled: false
          envVars:
            CHECKPOINT_DISABLE: "1"
            PRISMA_HIDE_UPDATE_MESSAGE: "true"
            PROXY_BASE_URL: "https://litellm.whitediver.keenetic.link"
            ALLOWED_EMAIL_DOMAINS: "whitediver.com"
            PROXY_ADMIN_ID: "113025592623482135602"
            GITHUB_COPILOT_TOKEN_DIR: "/tmp/github_copilot"
            GITHUB_COPILOT_ACCESS_TOKEN_FILE: "/etc/copilot/access-token"
            HTTPS_PROXY: "http://wg-vless-gateway-proxy.vpn.svc.cluster.local:1080"
            NO_PROXY: "localhost,127.0.0.1,.svc.cluster.local,.cluster.local,litellm,litellm-pg-rw,api.githubcopilot.com,api.github.com"
          extraEnvVars:
            - name: DISABLE_SCHEMA_UPDATE
              value: "true"
          environmentSecrets:
            - litellm-env-secret
          proxy_config:
            model_list:
              - model_name: "nvidia_nim/*"
                litellm_params:
                  model: "nvidia_nim/*"
                  api_key: os.environ/NVIDIA_NIM_API_KEY
                  api_base: os.environ/NVIDIA_NIM_API_BASE
            general_settings:
              master_key: os.environ/PROXY_MASTER_KEY
              store_model_in_db: true
            litellm_settings:
              turn_off_message_logging: true
            mcp_servers:
              jira:
                url: "http://mcp-atlassian-jira.mcp.svc.cluster.local:8000/mcp/jira"
                transport: "http"
                description: "Atlassian Jira"
                allow_all_keys: true
              confluence:
                url: "http://mcp-atlassian-confluence.mcp.svc.cluster.local:8000/mcp/confluence"
                transport: "http"
                description: "Atlassian Confluence"
                allow_all_keys: true
              gitlab:
                url: "http://mcp-gitlab.mcp.svc.cluster.local:3002/mcp"
                transport: "http"
                description: "GitLab (self-hosted, corp VPN)"
                allow_all_keys: true
              basic_memory:
                url: "http://basic-memory.mcp.svc.cluster.local:8000/mcp/basic-memory"
                transport: "http"
                description: "Basic Memory knowledge base"
                allow_all_keys: true
              kubernetes:
                url: "http://mcp-kubernetes.mcp.svc.cluster.local:8080/mcp"
                transport: "http"
                description: "Kubernetes cluster (home) - read/write"
                allow_all_keys: true
              grafana:
                url: "http://grafana-mcp.mcp.svc.cluster.local:8000/mcp"
                transport: "http"
                description: "Grafana (local homelab)"
                allow_all_keys: true
          volumes:
            - name: copilot-access
              secret:
                secretName: litellm-copilot-token
          volumeMounts:
            - name: copilot-access
              mountPath: /etc/copilot
              readOnly: true
          resources:
            requests:
              memory: "1Gi"
              cpu: "100m"
            limits:
              memory: "2Gi"
              cpu: "2"
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: NotIn
                        values:
                          - kube-worker-3
          strategy:
            type: Recreate
          startupProbe:
            failureThreshold: 90
          ingress:
            enabled: true
            className: nginx
            annotations:
              nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
              nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
            hosts:
              - host: litellm.whitediver.keenetic.link
                paths:
                  - path: /
                    pathType: Prefix
    - repoURL: https://github.com/Arbuzov/home-k8s-argo.git
      targetRevision: main
      path: ai/litellm/db
  destination:
    server: https://kubernetes.default.svc
    namespace: litellm
