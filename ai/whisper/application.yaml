apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: whisper
  namespace: argo-cd
spec:
  project: ai
  source:
    repoURL: https://github.com/Arbuzov/home-k8s-argo.git
    targetRevision: main
    path: ai/whisper/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: whisper
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
