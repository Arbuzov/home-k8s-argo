apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mcp
  namespace: argo-cd
spec:
  project: default
  source:
    repoURL: https://github.com/Arbuzov/home-k8s-argo.git
    targetRevision: main
    path: mcp
    directory:
      recurse: true
      include: '{project.yaml,*/application*.yaml}'
      # These three carry deployment-specific values that must not live in a
      # public repo (private hostAliases, VPN-side addresses), so their live
      # Applications are applied out-of-band and deliberately left unmanaged
      # here. Syncing them would overwrite the real values with the scrubbed
      # placeholders in git — for gitlab/ that wipes hostAliases and the pod
      # instantly loses DNS for the upstream host.
      exclude: '{graphiti/application.yaml,homeassistant/application.yaml,gitlab/application.yaml}'
  destination:
    server: https://kubernetes.default.svc
    namespace: argo-cd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
