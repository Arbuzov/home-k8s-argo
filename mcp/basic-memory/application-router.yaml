apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: basic-memory-router
  namespace: argo-cd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: mcp
  source:
    repoURL: https://bjw-s-labs.github.io/helm-charts
    chart: app-template
    targetRevision: 5.3.0
    helm:
      values: |
        controllers:
          basic-memory-router:
            type: deployment
            pod:
              nodeSelector:
                kubernetes.io/hostname: kube-worker-3
            containers:
              app:
                image:
                  repository: nginx
                  tag: 1.27-alpine
                  pullPolicy: IfNotPresent
                env:
                  NGINX_ENTRYPOINT_QUIET_LOGS: "1"
                ports:
                  - name: http
                    containerPort: 8000
                resources:
                  requests:
                    memory: 16Mi
                    cpu: 10m
                  limits:
                    memory: 64Mi
                probes:
                  liveness:
                    enabled: true
                    custom: true
                    spec:
                      httpGet:
                        path: /healthz
                        port: 8000
                      periodSeconds: 30
                  readiness:
                    enabled: true
                    custom: true
                    spec:
                      httpGet:
                        path: /healthz
                        port: 8000
                      periodSeconds: 10

        configMaps:
          config:
            data:
              default.conf: |
                map $http_x_bm_token $bm_instance {
                    default "";
                    include /etc/nginx/bm-tokens/tokens.map;
                }

                server {
                    listen 8000;
                    resolver kube-dns.kube-system.svc.cluster.local valid=30s ipv6=off;

                    location = /healthz {
                        access_log off;
                        return 200 "ok\n";
                    }

                    location = /mcp {
                        if ($bm_instance = "") {
                            return 403;
                        }
                        proxy_pass http://$bm_instance.mcp.svc.cluster.local:8000/mcp/$bm_instance$is_args$args;
                        proxy_http_version 1.1;
                        proxy_set_header Connection "";
                        proxy_set_header X-BM-Token "";
                        proxy_buffering off;
                        proxy_request_buffering off;
                        proxy_read_timeout 3600s;
                        proxy_send_timeout 3600s;
                    }

                    location / {
                        return 404;
                    }
                }

        service:
          basic-memory-router:
            controller: basic-memory-router
            ports:
              http:
                port: 8000

        persistence:
          config:
            type: configMap
            identifier: config
            globalMounts:
              - path: /etc/nginx/conf.d/default.conf
                subPath: default.conf
                readOnly: true
          tokens:
            type: secret
            name: basic-memory-router-tokens
            globalMounts:
              - path: /etc/nginx/bm-tokens
                readOnly: true
  destination:
    server: https://kubernetes.default.svc
    namespace: mcp
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
