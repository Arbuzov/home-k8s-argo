apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: basic-memory
  namespace: argo-cd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - list:
        elements:
          - name: basic-memory
  syncPolicy:
    preserveResourcesOnDeletion: true
  template:
    metadata:
      name: '{{ .name }}'
    spec:
      project: mcp
      source:
        repoURL: https://bjw-s-labs.github.io/helm-charts
        chart: app-template
        targetRevision: 5.3.0
        helm:
          values: |
            controllers:
              basic-memory:
                type: deployment
                replicas: 1
                pod:
                  nodeSelector:
                    kubernetes.io/hostname: kube-worker-3
                  securityContext:
                    fsGroup: 1000
                    fsGroupChangePolicy: OnRootMismatch
                containers:
                  app:
                    image:
                      repository: ghcr.io/basicmachines-co/basic-memory
                      tag: "1.0.0"
                      pullPolicy: IfNotPresent
                    command:
                      - basic-memory
                    args:
                      - mcp
                      - --transport
                      - streamable-http
                      - --host
                      - 0.0.0.0
                      - --port
                      - "8000"
                      - --path
                      - /mcp/{{ .name }}
                    env:
                      BASIC_MEMORY_HOME: /app/data
                      BASIC_MEMORY_CONFIG_DIR: /var/lib/basic-memory/state-v1
                      BASIC_MEMORY_DEFAULT_PROJECT: main
                      BASIC_MEMORY_INDEX_CHANGES: "true"
                      BASIC_MEMORY_LOG_LEVEL: INFO
                      BASIC_MEMORY_NO_PROMOS: "1"
                    ports:
                      - name: http
                        containerPort: 8000
                    resources:
                      requests:
                        memory: 1536Mi
                        cpu: 500m
                      limits:
                        memory: 2Gi
                        cpu: 2000m
                    probes:
                      liveness:
                        enabled: true
                        custom: true
                        spec:
                          tcpSocket:
                            port: 8000
                          initialDelaySeconds: 30
                          periodSeconds: 30
                      readiness:
                        enabled: true
                        custom: true
                        spec:
                          tcpSocket:
                            port: 8000
                          initialDelaySeconds: 10
                          periodSeconds: 10
                      startup:
                        enabled: true
                        custom: true
                        spec:
                          tcpSocket:
                            port: 8000
                          periodSeconds: 10
                          failureThreshold: 30

            service:
              basic-memory:
                controller: basic-memory
                ports:
                  http:
                    port: 8000

            persistence:
              data:
                enabled: true
                type: persistentVolumeClaim
                accessMode: ReadWriteOnce
                size: 5Gi
                storageClass: local-ssd
                forceRename: {{ .name }}-data-local
                retain: true
                advancedMounts:
                  basic-memory:
                    app:
                      - path: /app/data
              index:
                enabled: true
                type: persistentVolumeClaim
                accessMode: ReadWriteOnce
                size: 2Gi
                storageClass: local-path
                advancedMounts:
                  basic-memory:
                    app:
                      - path: /var/lib/basic-memory
      destination:
        server: https://kubernetes.default.svc
        namespace: mcp
      syncPolicy:
        automated:
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: basic-memory-smb
provisioner: smb.csi.k8s.io
reclaimPolicy: Retain
volumeBindingMode: Immediate
allowVolumeExpansion: true
parameters:
  source: "//192.168.99.44/smb-csi"
  subDir: "pvc-${pvc.metadata.namespace}-${pvc.metadata.name}"
  csi.storage.k8s.io/provisioner-secret-name: smbcreds
  csi.storage.k8s.io/provisioner-secret-namespace: smb
  csi.storage.k8s.io/node-stage-secret-name: smbcreds
  csi.storage.k8s.io/node-stage-secret-namespace: smb
mountOptions:
  - vers=3.1.1
  - serverino
  - actimeo=1
  - cache=none
  - nobrl
  - uid=1000
  - gid=1000
  - dir_mode=0700
  - file_mode=0600
