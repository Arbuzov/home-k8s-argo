apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: vikunja-pg
  namespace: vikunja
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:15.18
  primaryUpdateStrategy: unsupervised
  primaryUpdateMethod: switchover
  enableSuperuserAccess: true
  storage:
    size: 5Gi
    storageClass: local-ssd
  bootstrap:
    initdb:
      database: vikunja
      owner: vikunja
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                  - kube-master
                  - kube-worker-3
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
