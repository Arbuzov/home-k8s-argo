apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homepage
  namespace: argo-cd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: apps
  source:
    repoURL: https://unknowniq.github.io/helm-charts/
    targetRevision: 1.8.4
    helm:
      values: |
        env:
          - name: HOMEPAGE_ALLOWED_HOSTS
            value: homepage.whitediver.keenetic.link
          - name: HOMEPAGE_VAR_ARGOCD_TOKEN
            valueFrom:
              secretKeyRef:
                name: homepage-secrets
                key: HOMEPAGE_VAR_ARGOCD_TOKEN
          - name: HOMEPAGE_VAR_WORK_GITLAB_URL
            valueFrom:
              secretKeyRef:
                name: homepage-bookmarks
                key: HOMEPAGE_VAR_WORK_GITLAB_URL
          - name: HOMEPAGE_VAR_WORK_JENKINS_URL
            valueFrom:
              secretKeyRef:
                name: homepage-bookmarks
                key: HOMEPAGE_VAR_WORK_JENKINS_URL
          - name: HOMEPAGE_VAR_WORK_JIRA_URL
            valueFrom:
              secretKeyRef:
                name: homepage-bookmarks
                key: HOMEPAGE_VAR_WORK_JIRA_URL
          - name: HOMEPAGE_VAR_WORK_GRAFANA_URL
            valueFrom:
              secretKeyRef:
                name: homepage-bookmarks
                key: HOMEPAGE_VAR_WORK_GRAFANA_URL
        image:
          tag: v1.13.2
        config:
          settings:
            theme: dark
            color: gray
            target: _self
            layout:
              - Multimedia:
                  style: column
                  columns: 1
              - Home:
                  style: column
                  columns: 1
              - System:
                  style: column
                  columns: 1
          bookmarks:
            - Developer:
              - "Github Arbuzov":
                - icon: https://github.com/favicon.ico
                  href: https://github.com/arbuzov
              - "GitLab (work)":
                - icon: https://about.gitlab.com/images/press/gitlab-logo-500-rgb.png
                  href: "{{HOMEPAGE_VAR_WORK_GITLAB_URL}}"
              - "Jenkins (work)":
                - icon: jenkins.png
                  href: "{{HOMEPAGE_VAR_WORK_JENKINS_URL}}"
              - "Jira (work)":
                - icon: jira.png
                  href: "{{HOMEPAGE_VAR_WORK_JIRA_URL}}"
              - "Grafana (work)":
                - icon: https://upload.wikimedia.org/wikipedia/commons/thumb/3/3b/Grafana_icon.svg/250px-Grafana_icon.svg.png
                  href: "{{HOMEPAGE_VAR_WORK_GRAFANA_URL}}"
            - News:
              - "RBC":
                - icon: https://s0.rbk.ru/v1_static/images/common/logo.svg
                  href: https://rbc.ru/
              - "Linkedin":
                - icon: https://upload.wikimedia.org/wikipedia/commons/thumb/c/ca/LinkedIn_logo_initials.png/250px-LinkedIn_logo_initials.png
                  href: https://www.linkedin.com/
              - "IDBank":
                - icon: https://idbank.am/documents/IDBank_logo_300x300.png
                  href: https://idbank.am/ru/

          services:
            - Multimedia:
                - PiGallery2:
                    icon: pigallery2.png
                    description: Photo gallery
                    href: https://photos.whitediver.keenetic.link
                - Calibre-Web:
                    icon: calibre-web.png
                    description: E-book library
                    href: https://books.whitediver.keenetic.link
            - Home:
                - Home assistant:
                    icon: home-assistant.png
                    description: Smart home
                    href: https://home.whitediver.keenetic.link/
                - n8n:
                    icon: n8n.png
                    description: Workflow automation
                    href: https://n8n.whitediver.keenetic.link/
                - LiteLLM:
                    icon: https://avatars.githubusercontent.com/u/121462774?s=200&v=4
                    description: LLM proxy
                    href: https://litellm.whitediver.keenetic.link/
                - Vikunja:
                    icon: vikunja.png
                    description: Tasks
                    href: https://tasks.whitediver.keenetic.link/
                - OctoPrint:
                    icon: octoprint.png
                    description: 3D printer control
                    href: https://dev.whitediver.keenetic.link/octoprint/
            - System:
                - Grafana:
                    icon: grafana.png
                    description: Dashboards
                    href: https://dev.whitediver.keenetic.link/grafana/
                - Prometheus:
                    icon: prometheus.png
                    description: Metrics
                    href: https://dev.whitediver.keenetic.link/prometheus
                - Argo CD:
                    icon: https://argo-cd.readthedocs.io/en/stable/assets/logo.png
                    description: Declarative GitOps for Kubernetes
                    href: https://dev.whitediver.keenetic.link/argo-cd/
                    widget:
                      type: argocd
                      url: https://dev.whitediver.keenetic.link/argo-cd/
                      key: "{{HOMEPAGE_VAR_ARGOCD_TOKEN}}"

          widgets:
            - logo:
                icon: https://avatars.githubusercontent.com/u/1662280?s=200&v=4
            - kubernetes:
                cluster:
                  show: true
                  cpu: true
                  memory: true
                  showLabel: true
                  label: "k8s-local"
                nodes:
                  show: true
                  cpu: true
                  memory: true
                  showLabel: true


            - search:
                provider: [google, duckduckgo, bing, baidu, brave]
                target: _blank
            - openmeteo:
                label: Moscow
                latitude: 55.751244
                longitude: 37.618423
                timezone: Europe/Moscow
                units: metric
                cache: 5
                format:
                  maximumFractionDigits: 1

            - datetime:
                text_size: md
                locale: ru-RU
                format:
                  hour: 2-digit
                  minute: 2-digit
                  hourCycle: h23
                  timeZone: America/Toronto
                  timeZoneName: shortOffset
            - datetime:
                text_size: md
                locale: ru-RU
                format:
                  hour: 2-digit
                  minute: 2-digit
                  hourCycle: h23
                  timeZone: Europe/Moscow
                  timeZoneName: shortOffset
            - datetime:
                text_size: md
                locale: ru-RU
                format:
                  hour: 2-digit
                  minute: 2-digit
                  hourCycle: h23
                  timeZone: Australia/Sydney
                  timeZoneName: shortOffset

        customCss: |
          li.service .service-card,
          li.bookmark > a {
            height: 3.25rem;
            margin-bottom: 0.35rem;
          }
          li.service:has(.service-container) .service-card {
            height: auto;
          }
          li.service .service-name,
          li.bookmark .bookmark-name {
            font-size: 0.8rem;
            line-height: 1rem;
          }
          li.service .service-description,
          li.bookmark .bookmark-text {
            font-size: 0.65rem;
            line-height: 0.9rem;
          }
          li.bookmark div:has(> img),
          li.bookmark img {
            width: 1.75rem;
            height: 1.75rem;
          }
          .services-group,
          .bookmark-group {
            margin-bottom: 0.5rem;
          }

        customJs: |
          (function () {
            var ENDPOINT = "https://n8n.whitediver.keenetic.link/webhook/homepage-click";

            function findLabel(tile, a) {
              var n = tile.getAttribute("data-name");
              if (n && n.trim()) return n.trim().slice(0, 120);
              var el = a.querySelector(".bookmark-name, .service-name");
              if (el) {
                var raw = el.classList.contains("service-name") && el.firstChild
                  ? el.firstChild.textContent
                  : el.textContent;
                var t = (raw || "").trim();
                if (t) return t.slice(0, 120);
              }
              var title = (a.getAttribute("title") || "").trim();
              return title ? title.slice(0, 120) : "unknown";
            }

            function findGroup(tile) {
              var g = tile.closest(".services-group, .bookmark-group");
              if (!g) return "ungrouped";
              var h = g.querySelector(".service-group-name, .bookmark-group-name");
              var t = h && h.textContent ? h.textContent.trim() : "";
              return t ? t.slice(0, 120) : "ungrouped";
            }

            document.addEventListener("click", function (e) {
              var a = e.target.closest("a[href]");
              if (!a) return;
              var tile = a.closest("li.service, li.bookmark");
              if (!tile) return;
              var href = a.getAttribute("href") || "";
              if (!href || href.charAt(0) === "#" || href.indexOf("javascript:") === 0) return;

              var qs = new URLSearchParams({
                label: findLabel(tile, a),
                group: findGroup(tile),
                href: href
              });
              try { navigator.sendBeacon(ENDPOINT + "?" + qs.toString()); } catch (err) {}
            }, true);
          })();

        ingress:
          main:
            enabled: true
            ingressClassName: nginx
            hosts:
            - host: homepage.whitediver.keenetic.link
              paths:
              - path: /
                pathType: Prefix
    chart: homepage
  destination:
    server: https://kubernetes.default.svc
    namespace: homepage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
