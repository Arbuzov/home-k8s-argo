apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: localstack
  namespace: argo-cd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: apps
  source:
    repoURL: https://helm.localstack.cloud
    targetRevision: 0.7.0
    chart: localstack
    helm:
      values: |
        image:
          repository: localstack/localstack
        extraEnvVars:
          - name: LOCALSTACK_AUTH_TOKEN
            valueFrom:
              secretKeyRef:
                name: localstack
                key: LOCALSTACK_AUTH_TOKEN
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
        livenessProbe:
          initialDelaySeconds: 60
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 36
          successThreshold: 1

        readinessProbe:
          initialDelaySeconds: 60
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 36
          successThreshold: 1
        extraDeploy:
          - apiVersion: v1
            kind: Service
            metadata:
              name: localstack-external
              namespace: localstack
            spec:
              type: LoadBalancer
              loadBalancerIP: "192.168.99.44"
              externalIPs:
                - 192.168.99.44
              selector:
                app.kubernetes.io/name: localstack
                app.kubernetes.io/instance: localstack
              ports:
                - name: edge
                  port: 4566
                  targetPort: 4566
  destination:
    server: https://kubernetes.default.svc
    namespace: localstack
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
