apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: blackbox-exporter
  namespace: argo-cd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus-blackbox-exporter
    targetRevision: 11.15.1
    helm:
      values: |
        fullnameOverride: blackbox-exporter
        resources:
          requests:
            cpu: 10m
            memory: 24Mi
          limits:
            memory: 48Mi
        config:
          modules:
            tcp_connect:
              prober: tcp
              timeout: 5s
            mcp_http:
              prober: http
              timeout: 5s
              http:
                method: GET
                preferred_ip_protocol: ip4
                valid_status_codes: [200, 201, 202, 204, 301, 302, 307, 308, 400, 401, 403, 404, 405, 406, 426]
  destination:
    server: https://kubernetes.default.svc
    namespace: prometheus
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
