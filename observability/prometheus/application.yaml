apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argo-cd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus
    targetRevision: 28.7.0
    helm:
      values: |
        server:
          statefulSet:
            enabled: false
          persistentVolume:
            enabled: true
            size: 8Gi
            storageClass: local-path
            accessModes:
              - ReadWriteOnce
          retention: 90d
          persistent:
            enabled: false
          ingress:
            enabled: true
            ingressClassName: nginx
            hosts: ['dev.whitediver.keenetic.link', '']
            path: /prometheus
            tls:
              - secretName: dev.whitediver.keenetic.link-tls
                hosts: ['dev.whitediver.keenetic.link']
          baseURL: /prometheus
          prefixURL: /prometheus
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
            requests:
              cpu: 200m
              memory: 768Mi
          extraVolumes:
            - name: blackbox-targets
              secret:
                secretName: blackbox-targets
                optional: true
          extraVolumeMounts:
            - name: blackbox-targets
              mountPath: /etc/prometheus/blackbox-targets
              readOnly: true
        alertmanager:
          enabled: false
          ingressClassName: "nginx"
        forceNamespace: "prometheus"
        extraScrapeConfigs: |
          - job_name: cloudnative-pg
            kubernetes_sd_configs:
              - role: pod
            relabel_configs:
              - source_labels: [__meta_kubernetes_pod_label_cnpg_io_cluster]
                regex: .+
                action: keep
              - source_labels: [__meta_kubernetes_pod_container_port_number]
                regex: "9187"
                action: keep
              - source_labels: [__meta_kubernetes_namespace]
                target_label: namespace
              - source_labels: [__meta_kubernetes_pod_name]
                target_label: pod
              - source_labels: [__meta_kubernetes_pod_label_cnpg_io_cluster]
                target_label: cluster
              - source_labels: [__meta_kubernetes_pod_node_name]
                target_label: node
          - job_name: argo-cd
            kubernetes_sd_configs:
              - role: pod
                namespaces:
                  names: [argo-cd]
            relabel_configs:
              - source_labels: [__meta_kubernetes_pod_container_port_name]
                regex: metrics
                action: keep
              - source_labels: [__meta_kubernetes_namespace]
                target_label: namespace
              - source_labels: [__meta_kubernetes_pod_name]
                target_label: pod
              - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
                target_label: component
          - job_name: ingress-nginx
            kubernetes_sd_configs:
              - role: endpoints
                namespaces:
                  names: [nginx]
            relabel_configs:
              - source_labels: [__meta_kubernetes_service_name]
                regex: nginx-ingress-nginx-controller-metrics
                action: keep
            metric_relabel_configs:
              - source_labels: [__name__]
                regex: nginx_ingress_controller_(requests|response_size_sum|response_size_count|request_duration_seconds_bucket|request_duration_seconds_count|ssl_expire_time_seconds)
                action: keep
          - job_name: blackbox-cascade
            metrics_path: /probe
            params:
              module: [tcp_connect]
            file_sd_configs:
              - files:
                  - /etc/prometheus/blackbox-targets/*.yml
            relabel_configs:
              - source_labels: [__address__]
                target_label: __param_target
              - source_labels: [__param_target]
                target_label: instance
              - target_label: __address__
                replacement: blackbox-exporter.prometheus.svc:9115
          - job_name: blackbox-mcp
            metrics_path: /probe
            params:
              module: [mcp_http]
            static_configs:
              - targets: ['http://basic-memory.mcp.svc:8000']
                labels: {server: basic-memory}
              - targets: ['http://codex.mcp.svc:4141']
                labels: {server: codex}
              - targets: ['http://grafana-mcp.mcp.svc:8000']
                labels: {server: grafana}
              - targets: ['http://mcp-atlassian-confluence.mcp.svc:8000']
                labels: {server: confluence}
              - targets: ['http://mcp-atlassian-jira.mcp.svc:8000']
                labels: {server: jira}
              - targets: ['http://mcp-gitlab.mcp.svc:3002']
                labels: {server: gitlab}
              - targets: ['http://mcp-kubernetes.mcp.svc:8080']
                labels: {server: kubernetes}
              - targets: ['http://mcpo.mcp.svc:8000']
                labels: {server: mcpo}
              - targets: ['http://oathkeeper-proxy.mcp.svc:4455']
                labels: {server: oathkeeper}
            relabel_configs:
              - source_labels: [__address__]
                target_label: __param_target
              - source_labels: [__param_target]
                target_label: instance
              - target_label: __address__
                replacement: blackbox-exporter.prometheus.svc:9115
          - job_name: kubelet
            scheme: https
            metrics_path: /metrics/cadvisor
            tls_config:
              insecure_skip_verify: true
            bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
            kubernetes_sd_configs:
              - role: node
            relabel_configs:
              - source_labels: [__meta_kubernetes_node_name]
                target_label: node
              - target_label: metrics_path
                replacement: /metrics/cadvisor
            metric_relabel_configs:
              - source_labels: [__name__]
                regex: container_(cpu_usage_seconds_total|cpu_cfs_throttled_periods_total|cpu_cfs_periods_total|memory_working_set_bytes|spec_cpu_quota|spec_cpu_period|network_receive_bytes_total|network_transmit_bytes_total)
                action: keep
              - source_labels: [namespace]
                regex: vpn|n8n|litellm|vikunja
                action: keep
          - job_name: kubelet-stats
            scheme: https
            metrics_path: /metrics
            tls_config:
              insecure_skip_verify: true
            bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
            kubernetes_sd_configs:
              - role: node
            relabel_configs:
              - source_labels: [__meta_kubernetes_node_name]
                target_label: node
            metric_relabel_configs:
              - source_labels: [__name__]
                regex: kubelet_volume_stats_.*
                action: keep
        serverFiles:
          recording_rules.yml:
            groups:
              - name: kube-cadvisor
                interval: 1m
                rules:
                  - record: node_namespace_pod_container:container_cpu_usage_seconds_total:sum_irate
                    expr: |
                      sum by (namespace, pod, container) (
                        irate(container_cpu_usage_seconds_total{job="kubelet", metrics_path="/metrics/cadvisor", image!=""}[5m])
                      )
          alerting_rules.yml:
            groups:
              - name: claude-service
                interval: 1m
                rules:
                  - alert: ClaudeCodeDegraded
                    expr: claude_status_component_health{component="Claude Code"} < 1
                    for: 5m
                    labels:
                      severity: info
                    annotations:
                      summary: "Anthropic сообщает о проблемах с Claude Code"
                      description: "https://status.anthropic.com"
                  - alert: ClaudeApiMajorOutage
                    expr: claude_status_component_health{component="Claude API (api.anthropic.com)"} == 0
                    for: 5m
                    labels:
                      severity: warning
                    annotations:
                      summary: "Major outage Claude API по данным status.anthropic.com"
                  - alert: ClaudeStatusExporterDown
                    expr: up{job="claude-status"} == 0
                    for: 10m
                    labels:
                      severity: warning
                    annotations:
                      summary: "claude_status_exporter не скрейпится"
        prometheus-node-exporter:
          resources:
            limits:
              cpu: 100m
              memory: 32Mi
            requests:
              cpu: 100m
              memory: 32Mi
        kube-state-metrics:
          resources:
            limits:
              cpu: 150m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi
        prometheus-pushgateway:
          resources:
            limits:
              cpu: 100m
              memory: 64Mi
            requests:
              cpu: 25m
              memory: 32Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: prometheus
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
