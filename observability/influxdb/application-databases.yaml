apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: influxdb-databases
  namespace: argo-cd
spec:
  project: observability
  source:
    repoURL: https://github.com/Arbuzov/home-k8s-argo.git
    targetRevision: main
    path: observability/influxdb/databases
  destination:
    server: https://kubernetes.default.svc
    namespace: influxdb
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - ServerSideDiff=true
